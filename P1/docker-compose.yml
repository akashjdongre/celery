services:
  redis:
    image: redis:7-alpine
    container_name: redis_container
  
  celery_worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    depends_on:
      - redis
    
  app:
    build: .
    container_name: celery_app_container
    command: python -m app.main
    depends_on:
      - redis