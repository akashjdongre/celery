<html>
    <head>
        <title>My App</title>
    </head>
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
    </nav>
    <body>
        <h1>Welcome to My App - Result </h1>
        <hr>
        <p>This is a simple Django app with Celery integration.</p>

        {% if result.id %}
        <h4>Task ID: {{ result.id }}</h4>
        <h4>Task ID: {{ result.task_id }}</h4>
        <h4>Status: {{ result.status }}</h4>
        <h4>State: {{ result.state }}</h4>
        <h4>Result Value: {{ result.result }}</h4>
        {% endif %}

    </body>
</html>
